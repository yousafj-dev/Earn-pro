name: Build Android APK and Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Firebase configuration exists
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            echo "Missing lib/firebase_options.dart."
            echo "Create a Firebase project and run: flutterfire configure"
            exit 1
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: earning-app-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: earning-app-web-build
          path: build/web/
